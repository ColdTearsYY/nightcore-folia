name: Build and Retrieve Compiled Files  
  
on:  
  push:  
    branches: [ feat/folia-support, main, master ]  
  pull_request:  
    branches: [ feat/folia-support, main, master ]
  workflow_dispatch:
  
jobs:  
  build:  
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:  
    - uses: actions/checkout@v4  
      
    - name: Set up JDK 21  
      uses: actions/setup-java@v4  
      with:  
        java-version: '21'  
        distribution: 'temurin'  
      
    - name: Cache Maven dependencies  
      uses: actions/cache@v3  
      with:  
        path: ~/.m2  
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}  
        restore-keys: ${{ runner.os }}-m2  
      
    - name: Build with Maven  
      run: mvn -B clean package --file pom.xml  
      
    - name: List built artifacts
      run: find . -path '*/target/*.jar' ! -path '*/target/original-*.jar' -type f
      
    - name: Upload shaded JAR artifacts  
      uses: actions/upload-artifact@v4  
      with:  
        name: nightcore-shaded-jar  
        path: main/target/*-shaded.jar  
        retention-days: 30
        if-no-files-found: warn
      
    - name: Upload all JAR artifacts  
      uses: actions/upload-artifact@v4  
      with:  
        name: nightcore-all-jars  
        path: |  
          **/target/*.jar  
          !**/target/original-*.jar  
        retention-days: 30
        if-no-files-found: warn
